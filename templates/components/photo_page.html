{% for photo in photos %}{% include 'components/photo_card.html' with active_category=category %}{% empty %}{% if is_initial_filter %}<div class="empty"><span>✧</span><h3>Nenhuma lembrança nesta categoria ainda.</h3><p>Que tal compartilhar a primeira?</p><button class="button primary" data-action="open-upload">Compartilhar uma foto</button></div>{% endif %}{% endfor %}
{% if next_cursor %}<div class="load-more" hx-get="{% url 'photo-page' event.slug %}?before={{ next_cursor }}{% if category %}&category={{ category }}{% endif %}" hx-trigger="intersect once" hx-swap="outerHTML"><span>Carregando mais lembranças…</span></div>{% endif %}
