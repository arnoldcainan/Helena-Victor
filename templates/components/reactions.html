<div class="reactions" id="reactions-{{ photo.id }}">
  <button class="{% if 'heart' in photo.reacted_emojis %}active{% endif %}" hx-post="{% url 'react' photo.id %}" hx-target="#reactions-{{ photo.id }}" hx-vals='{"emoji":"heart"}' aria-label="Reagir com coração" aria-pressed="{% if 'heart' in photo.reacted_emojis %}true{% else %}false{% endif %}">❤️ <small>{{ photo.heart_count|default:0 }}</small></button>
  <button class="{% if 'love' in photo.reacted_emojis %}active{% endif %}" hx-post="{% url 'react' photo.id %}" hx-target="#reactions-{{ photo.id }}" hx-vals='{"emoji":"love"}' aria-label="Reagir com apaixonado" aria-pressed="{% if 'love' in photo.reacted_emojis %}true{% else %}false{% endif %}">😍 <small>{{ photo.love_count|default:0 }}</small></button>
  <button class="{% if 'touched' in photo.reacted_emojis %}active{% endif %}" hx-post="{% url 'react' photo.id %}" hx-target="#reactions-{{ photo.id }}" hx-vals='{"emoji":"touched"}' aria-label="Reagir com emoção" aria-pressed="{% if 'touched' in photo.reacted_emojis %}true{% else %}false{% endif %}">🥹 <small>{{ photo.touched_count|default:0 }}</small></button>
  <button class="{% if 'sparkle' in photo.reacted_emojis %}active{% endif %}" hx-post="{% url 'react' photo.id %}" hx-target="#reactions-{{ photo.id }}" hx-vals='{"emoji":"sparkle"}' aria-label="Reagir com brilho" aria-pressed="{% if 'sparkle' in photo.reacted_emojis %}true{% else %}false{% endif %}">✨ <small>{{ photo.sparkle_count|default:0 }}</small></button>
</div>
